<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Relationship status: Java — married; Go — it's complicated; Haskell — secret crush">
  <style>
    text { font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .name { font-size: 26px; font-weight: 700; }
    .chip { font-size: 12px; font-weight: 700; }
    .body { font-size: 13px; fill: #c9d1d9; }
    .dim { fill: #8b949e; }
    .code { font-size: 12.5px; }
    .card { opacity: 0; animation: in .5s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .steam { animation: steam 2.6s ease-in-out infinite; }
    @keyframes steam { 0% { opacity: 0; transform: translateY(4px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-8px); } }
    .zoom { animation: zoom 1.6s ease-in-out infinite; }
    @keyframes zoom { 50% { transform: translateX(-5px); opacity: .5; } }
    .beat { animation: beat 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes beat { 15% { transform: scale(1.25); } 30% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .card { animation: none; opacity: 1; } .steam, .zoom, .beat { animation: none; } }
  </style>

  <!-- JAVA -->
  <g class="card" style="animation-delay:.1s">
    <rect x="1" y="1" width="308" height="298" rx="14" fill="#0d1117" stroke="#f89820" stroke-opacity="0.55"/>
    <rect x="16" y="1" width="278" height="3" rx="1.5" fill="#f89820"/>
    <g transform="translate(22 20)">
      <path class="steam" style="animation-delay:0s" d="M18 16 c-4 -5 4 -8 0 -14" fill="none" stroke="#5382a1" stroke-width="2.5" stroke-linecap="round"/>
      <path class="steam" style="animation-delay:.6s" d="M26 16 c-4 -5 4 -8 0 -14" fill="none" stroke="#5382a1" stroke-width="2.5" stroke-linecap="round"/>
      <path class="steam" style="animation-delay:1.2s" d="M34 16 c-4 -5 4 -8 0 -14" fill="none" stroke="#5382a1" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M8 22 H44 V34 C44 44 36 50 26 50 C16 50 8 44 8 34 Z" fill="#f89820"/>
      <path d="M44 26 C55 26 55 40 44 40" fill="none" stroke="#f89820" stroke-width="3.5"/>
      <ellipse cx="26" cy="54" rx="24" ry="3.5" fill="#5382a1"/>
    </g>
    <text class="name" x="92" y="48" fill="#f89820">Java</text>
    <rect x="92" y="60" width="174" height="22" rx="11" fill="#f89820" fill-opacity="0.15" stroke="#f89820" stroke-opacity="0.6"/>
    <text class="chip" x="179" y="75" text-anchor="middle" fill="#f89820"><tspan class="beat">♥</tspan> married · since 1.x</text>
    <text class="body" x="24" y="120">Spring · Quarkus · Mutiny · Loom.</text>
    <text class="body" x="24" y="142">20+ years together, still in</text>
    <text class="body" x="24" y="164">love. Reactive, functional-ish,</text>
    <text class="body" x="24" y="186">virtual threads on Sundays.</text>
    <text class="body dim" x="24" y="212">We still argue about checked</text>
    <text class="body dim" x="24" y="230">exceptions. Every. Time.</text>
    <rect x="12" y="248" width="286" height="38" rx="8" fill="#161b22"/>
    <text class="code" x="24" y="272"><tspan fill="#ff7b72">var</tspan><tspan fill="#c9d1d9"> me = </tspan><tspan fill="#d2a8ff">Optional</tspan><tspan fill="#c9d1d9">.of(</tspan><tspan fill="#79c0ff">java</tspan><tspan fill="#c9d1d9">);</tspan></text>
  </g>

  <!-- GO -->
  <g class="card" style="animation-delay:.35s">
    <rect x="346" y="1" width="308" height="298" rx="14" fill="#0d1117" stroke="#00add8" stroke-opacity="0.55"/>
    <rect x="361" y="1" width="278" height="3" rx="1.5" fill="#00add8"/>
    <g class="zoom">
      <rect x="364" y="36" width="16" height="3.5" rx="1.75" fill="#00add8"/>
      <rect x="358" y="45" width="20" height="3.5" rx="1.75" fill="#00add8"/>
      <rect x="366" y="54" width="12" height="3.5" rx="1.75" fill="#00add8"/>
    </g>
    <text x="382" y="63" font-size="36" font-weight="800" font-style="italic" fill="#00add8" letter-spacing="-2">GO</text>
    <text class="name" x="437" y="48" fill="#00add8">Go</text>
    <rect x="437" y="60" width="174" height="22" rx="11" fill="#00add8" fill-opacity="0.15" stroke="#00add8" stroke-opacity="0.6"/>
    <text class="chip" x="524" y="75" text-anchor="middle" fill="#00add8">⚠ it's complicated</text>
    <text class="body" x="369" y="120">goroutines on the side.</text>
    <text class="body" x="369" y="142">Fast, simple, honest errors.</text>
    <text class="body" x="369" y="164">No generics, they said…</text>
    <text class="body" x="369" y="186">oh wait, now it has them.</text>
    <text class="body dim" x="369" y="212">Java knows.</text>
    <text class="body dim" x="369" y="230">Java is fine. Java is fine.</text>
    <rect x="357" y="248" width="286" height="38" rx="8" fill="#161b22"/>
    <text class="code" x="369" y="272"><tspan fill="#ff7b72">go</tspan><tspan fill="#ff7b72"> func</tspan><tspan fill="#c9d1d9">() { </tspan><tspan fill="#d2a8ff">flirt</tspan><tspan fill="#c9d1d9">() }()</tspan><tspan fill="#8b949e"> // shh</tspan></text>
  </g>

  <!-- HASKELL -->
  <g class="card" style="animation-delay:.6s">
    <rect x="691" y="1" width="308" height="298" rx="14" fill="#0d1117" stroke="#a371f7" stroke-opacity="0.55" stroke-dasharray="6 5"/>
    <rect x="706" y="1" width="278" height="3" rx="1.5" fill="#a371f7"/>
    <g transform="translate(710 26) scale(3.3)">
      <path d="M0 12 L4 6 L0 0 H3 L7 6 L3 12 Z" fill="#453a62"/>
      <path d="M4 12 L8 6 L4 0 H7 L15 12 H12 L9.5 8.25 L7 12 Z" fill="#5e5086"/>
      <path d="M13.667 8.5 L12.333 6.5 H17 V8.5 Z" fill="#8f4e8b"/>
      <path d="M11.667 5.5 L10.333 3.5 H17 V5.5 Z" fill="#8f4e8b"/>
    </g>
    <text class="name" x="782" y="48" fill="#a371f7">Haskell</text>
    <rect x="782" y="60" width="174" height="22" rx="11" fill="#a371f7" fill-opacity="0.15" stroke="#a371f7" stroke-opacity="0.6"/>
    <text class="chip" x="869" y="75" text-anchor="middle" fill="#d2a8ff">♡ secret crush</text>
    <text class="body" x="714" y="120">Pure. Lazy. Beautiful.</text>
    <text class="body" x="714" y="142">I read monad tutorials at</text>
    <text class="body" x="714" y="164">2 a.m. like it's poetry.</text>
    <text class="body" x="714" y="186">Haven't told anyone.</text>
    <text class="body dim" x="714" y="212">…well. Now I have.</text>
    <text class="body dim" x="714" y="230">Side effects: none (so far).</text>
    <rect x="702" y="248" width="286" height="38" rx="8" fill="#161b22"/>
    <text class="code" x="714" y="272"><tspan fill="#d2a8ff">main</tspan><tspan fill="#c9d1d9"> = </tspan><tspan fill="#79c0ff">forever</tspan><tspan fill="#c9d1d9"> dream</tspan><tspan fill="#8b949e"> -- λ</tspan></text>
  </g>
</svg>
