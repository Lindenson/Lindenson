<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Career as a git graph: 1995 C and assembly at a chemical plant, banking automation, a 1,200 MW power project in Nigeria, SiForeca ML platform, fintech, Vodafone, and now architect instrumenting AI agents; a side branch keeps writing C for microcontrollers">
  <defs>
    <linearGradient id="main" gradientUnits="userSpaceOnUse" x1="60" y1="0" x2="836" y2="0">
      <stop offset="0" stop-color="#f89820"/>
      <stop offset="0.55" stop-color="#00add8"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#a371f7" stop-opacity="0.55"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect x="1" y="1" width="998" height="338" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .draw { stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 2.4s ease-out forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .in { opacity: 0; animation: in .4s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
    .pulse { animation: pulse 2.2s ease-in-out infinite; transform-origin: 836px 150px; }
    @keyframes pulse { 50% { transform: scale(1.35); opacity: .55; } }
    .yr { font-size: 15px; font-weight: 700; }
    .msg { font-size: 12px; fill: #c9d1d9; paint-order: stroke; stroke: #0d1117; stroke-width: 6px; stroke-linejoin: round; }
    .sub { font-size: 11.5px; fill: #8b949e; paint-order: stroke; stroke: #0d1117; stroke-width: 6px; stroke-linejoin: round; }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none; stroke-dashoffset: 0; } .in { animation: none; opacity: 1; } .pulse { animation: none; } }
  </style>

  <g clip-path="url(#frame)"><rect width="1000" height="340" fill="#0d1117"/></g>
  <rect x="0.5" y="0.5" width="999" height="339" rx="16" fill="none" stroke="#30363d"/>
  <text x="32" y="40" font-size="14" fill="#3fb950">❯ <tspan fill="#e6edf3">git log --graph --all</tspan> <tspan fill="#8b949e">--author=wolper --since=1995</tspan></text>

  <!-- side branch: C never died -->
  <path class="draw" style="animation-delay:.6s" d="M60 150 V205 C60 240 85 262 130 262 H740 C800 262 826 215 836 160" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="1200"/>
  <text class="in" style="animation-delay:1.4s" x="146" y="254" font-size="12" fill="#3fb950" font-style="italic">branch: c-never-dies</text>

  <!-- main line -->
  <line class="draw" x1="60" y1="150" x2="836" y2="150" stroke="url(#main)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- commits on main -->
  <g class="in" style="animation-delay:.2s">
    <text class="yr" x="60" y="128" text-anchor="middle" fill="#f89820">1995</text>
    <circle cx="60" cy="150" r="8" fill="#0d1117" stroke="#f89820" stroke-width="3"/>
    <text class="msg" x="60" y="180" text-anchor="middle">init: C + asm</text>
    <text class="sub" x="60" y="196" text-anchor="middle">chemical plant</text>
  </g>
  <g class="in" style="animation-delay:.5s">
    <text class="yr" x="188" y="128" text-anchor="middle" fill="#f0883e">2000s</text>
    <circle cx="188" cy="150" r="7" fill="#0d1117" stroke="#f0883e" stroke-width="3"/>
    <text class="msg" x="188" y="180" text-anchor="middle">feat: banking</text>
    <text class="sub" x="188" y="196" text-anchor="middle">+ teaching</text>
  </g>
  <g class="in" style="animation-delay:.8s">
    <text class="yr" x="316" y="128" text-anchor="middle" fill="#d29922">2014</text>
    <circle cx="316" cy="150" r="7" fill="#0d1117" stroke="#d29922" stroke-width="3"/>
    <text class="msg" x="316" y="180" text-anchor="middle">ops: Nigeria</text>
    <text class="sub" x="316" y="196" text-anchor="middle">1,200 MW plant</text>
  </g>
  <g class="in" style="animation-delay:1.1s">
    <text class="yr" x="444" y="128" text-anchor="middle" fill="#3fb9a0">2017</text>
    <circle cx="444" cy="150" r="7" fill="#0d1117" stroke="#3fb9a0" stroke-width="3"/>
    <text class="msg" x="444" y="180" text-anchor="middle">feat: SiForeca</text>
    <text class="sub" x="444" y="196" text-anchor="middle">ML pre-hype</text>
  </g>
  <g class="in" style="animation-delay:1.4s">
    <text class="yr" x="572" y="128" text-anchor="middle" fill="#00add8">2019</text>
    <circle cx="572" cy="150" r="7" fill="#0d1117" stroke="#00add8" stroke-width="3"/>
    <text class="msg" x="572" y="180" text-anchor="middle">feat: fintech</text>
    <text class="sub" x="572" y="196" text-anchor="middle">payments · CRM</text>
  </g>
  <g class="in" style="animation-delay:1.7s">
    <text class="yr" x="700" y="128" text-anchor="middle" fill="#58a6ff">2023</text>
    <circle cx="700" cy="150" r="7" fill="#0d1117" stroke="#58a6ff" stroke-width="3"/>
    <text class="msg" x="700" y="180" text-anchor="middle">scale: Vodafone</text>
    <text class="sub" x="700" y="196" text-anchor="middle">TOBi × LLMs</text>
  </g>

  <!-- HEAD -->
  <g class="in" style="animation-delay:2.1s">
    <circle class="pulse" cx="836" cy="150" r="20" fill="url(#halo)"/>
    <circle cx="836" cy="150" r="10" fill="#a371f7"/>
    <rect x="858" y="138" width="88" height="24" rx="12" fill="#a371f7" fill-opacity="0.18" stroke="#a371f7"/>
    <text x="902" y="155" font-size="12.5" fill="#d2a8ff" text-anchor="middle" font-weight="700">HEAD</text>
    <text class="yr" x="836" y="122" text-anchor="middle" fill="#a371f7">2025 → now</text>
    <text class="msg" x="852" y="186" fill="#e6edf3">architect</text>
    <text class="sub" x="852" y="202">AI agents · Hormigas</text>
  </g>

  <!-- commits on side branch -->
  <g class="in" style="animation-delay:1.9s">
    <circle cx="490" cy="262" r="6.5" fill="#0d1117" stroke="#3fb950" stroke-width="2.5"/>
    <text class="msg" x="490" y="290" text-anchor="middle">STM32 / FreeRTOS</text>
    <text class="sub" x="490" y="306" text-anchor="middle">relays · PIR · FSMs</text>
  </g>
  <g class="in" style="animation-delay:2.1s">
    <circle cx="672" cy="262" r="6.5" fill="#0d1117" stroke="#3fb950" stroke-width="2.5"/>
    <text class="msg" x="672" y="290" text-anchor="middle">garageAlarms platform</text>
    <text class="sub" x="672" y="306" text-anchor="middle">IoT fleet meets CAP theorem</text>
  </g>
</svg>
