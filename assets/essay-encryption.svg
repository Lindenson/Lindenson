<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 250" width="490" height="250" role="img" aria-label="Essay: The Message Only Two Devices Can Read — closed-chat end-to-end encryption with X3DH and Double Ratchet">
  <style>
    text { font-family: "JetBrains Mono", "Fira Code", "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .wave { animation: wave 6s linear infinite; }
    @keyframes wave { to { transform: translateX(-120px); } }
    .pkt { animation: pkt 3.2s ease-in-out infinite; }
    @keyframes pkt { 0% { transform: translateX(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(212px); opacity: 0; } }
    .shine { animation: shine 2.4s ease-in-out infinite; }
    @keyframes shine { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .wave, .pkt, .shine { animation: none; } }
  </style>
  <defs>
    <radialGradient id="g" cx="1" cy="0" r="1"><stop offset="0" stop-color="#a371f7" stop-opacity="0.25"/><stop offset="1" stop-color="#a371f7" stop-opacity="0"/></radialGradient>
    <clipPath id="f"><rect x="1" y="1" width="488" height="248" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#f)">
    <rect width="490" height="250" fill="#0d1117"/>
    <rect width="490" height="250" fill="url(#g)"/>
    <text x="26" y="36" font-size="12" fill="#a371f7" letter-spacing="2">ESSAY 02 · CRYPTOGRAPHY</text>
    <text x="464" y="36" font-size="12" fill="#8b949e" text-anchor="end">read ↗</text>
    <text x="26" y="72" font-size="22" font-weight="700" fill="#e6edf3">The Message Only Two</text>
    <text x="26" y="98" font-size="22" font-weight="700" fill="#e6edf3">Devices Can Read</text>
    <text x="26" y="124" font-size="13" fill="#c9d1d9">closed-chat E2EE, reconciled with</text>
    <text x="26" y="143" font-size="13" fill="#c9d1d9">drop-and-recover delivery</text>
    <rect x="26" y="158" width="47" height="22" rx="11" fill="#a371f7" fill-opacity="0.12" stroke="#a371f7" stroke-opacity="0.45"/><text x="49.5" y="173" font-size="12" text-anchor="middle" fill="#c9d1d9">X3DH</text>
  <rect x="81" y="158" width="120" height="22" rx="11" fill="#a371f7" fill-opacity="0.12" stroke="#a371f7" stroke-opacity="0.45"/><text x="141.0" y="173" font-size="12" text-anchor="middle" fill="#c9d1d9">Double Ratchet</text>
  <rect x="209" y="158" width="61" height="22" rx="11" fill="#a371f7" fill-opacity="0.12" stroke="#a371f7" stroke-opacity="0.45"/><text x="239.5" y="173" font-size="12" text-anchor="middle" fill="#c9d1d9">Signal</text>
  <rect x="278" y="158" width="120" height="22" rx="11" fill="#a371f7" fill-opacity="0.12" stroke="#a371f7" stroke-opacity="0.45"/><text x="338.0" y="173" font-size="12" text-anchor="middle" fill="#c9d1d9">safety numbers</text>
    <!-- two devices + ciphertext in flight -->
    <rect x="60" y="200" width="22" height="34" rx="5" fill="none" stroke="#3fb950" stroke-width="2"/>
    <rect x="408" y="200" width="22" height="34" rx="5" fill="none" stroke="#3fb950" stroke-width="2"/>
    <line x1="92" y1="217" x2="398" y2="217" stroke="#30363d" stroke-width="2" stroke-dasharray="4 5"/>
    <g transform="translate(232 204)">
      <rect x="0" y="9" width="26" height="20" rx="4" fill="#0d1117" stroke="#a371f7" stroke-width="2"/>
      <path d="M6 9 v-4 a7 7 0 0 1 14 0 v4" fill="none" stroke="#a371f7" stroke-width="2"/>
      <circle class="shine" cx="13" cy="19" r="2.5" fill="#a371f7"/>
    </g>
    <g class="pkt"><text x="96" y="213" font-size="11" fill="#a371f7">0x9f3a…</text></g>
    <text x="245" y="246" font-size="10.5" fill="#6e7681" text-anchor="middle">server sees ciphertext only</text>
  </g>
  <rect x="0.5" y="0.5" width="489" height="249" rx="14" fill="none" stroke="#a371f7" stroke-opacity="0.5"/>
</svg>
