  </defs>
  <g clip-path="url(#f)">
    <rect width="490" height="220" fill="#0d1117"/>
    <rect class="glow" width="490" height="220" fill="url(#g)"/>
    <rect width="5" height="220" fill="#ff7b72"/>
  </g>
  <rect x="0.5" y="0.5" width="489" height="219" rx="14" fill="none" stroke="#30363d"/>
