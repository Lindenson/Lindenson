    @keyframes ring { 50% { opacity: .15; } }
    .glow { animation: glow 3s ease-in-out infinite; }
    @keyframes glow { 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .ring, .glow { animation: none; } }
  </style>
